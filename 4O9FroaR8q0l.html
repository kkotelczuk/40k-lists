<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vienna Summer Major WH40K 2026</title>
<style>
  :root{
    --bg:#12141a; --panel:#1b1e27; --panel2:#232735; --line:#2f3446;
    --txt:#e8eaf0; --dim:#9aa3b8;
    --purge:#e53935; --recon:#00b3a4; --disrupt:#2b7fff;
    --take:#38b000; --priority:#f2b705; --none:#5b6478;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:10;background:var(--panel);
         border-bottom:1px solid var(--line);padding:14px 20px}
  h1{margin:0 0 2px;font-size:17px}
  .sub{color:var(--dim);font-size:13px}
  .sub a{color:var(--dim)}
  .pick{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
  input[type=search],select{background:var(--panel2);color:var(--txt);
    border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:15px}
  input[type=search]{min-width:260px}
  select{min-width:320px}
  .count{color:var(--dim);font-size:13px}
  .hits{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .hits button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
    border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
  .hits button:hover{background:#2c3143}
  .hits button.on{background:#38405a;border-color:#5a648a}
  .bar{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
  .titles{min-width:0}
  #menu{display:none;flex:none;background:var(--panel2);color:var(--txt);
        border:1px solid var(--line);border-radius:8px;padding:9px 13px;font-size:14px;
        cursor:pointer;white-space:nowrap}
  #menu:hover{background:#2c3143}
  main{padding:18px 20px 60px}
  .teamhead{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin:4px 0 16px}
  .teamhead h2{margin:0;font-size:22px}
  .teamhead .meta{color:var(--dim);font-size:13px}
  .players{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        overflow:hidden;display:flex;flex-direction:column}
  .card .top{padding:12px 14px;border-bottom:1px solid var(--line);
             display:flex;gap:12px;align-items:center;justify-content:space-between}
  .who{min-width:0}
  .who .nm{font-size:17px;font-weight:600}
  .who .fc{color:var(--dim);font-size:13px}
  .disp{flex:none;font-size:15px;font-weight:700;letter-spacing:.02em;
        padding:9px 14px;border-radius:9px;color:#0d0f14;white-space:nowrap;
        text-transform:uppercase}
  .d-purge{background:var(--purge);color:#fff}
  .d-recon{background:var(--recon)}
  .d-disrupt{background:var(--disrupt);color:#fff}
  .d-take{background:var(--take);color:#fff}
  .d-priority{background:var(--priority)}
  .d-none{background:var(--none);color:#dfe3ee}
  .card.b-purge{border-color:var(--purge)}
  .card.b-recon{border-color:var(--recon)}
  .card.b-disrupt{border-color:var(--disrupt)}
  .card.b-take{border-color:var(--take)}
  .card.b-priority{border-color:var(--priority)}
  .short{margin:0;padding:14px;white-space:pre-wrap;word-break:break-word;
    font:15px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#f2f4fa;
    background:#1b2030;flex:1}
  .short .hd{color:var(--dim);font-size:13px}
  details{border-top:1px solid var(--line)}
  summary{padding:9px 14px;cursor:pointer;color:var(--dim);font-size:13px;user-select:none}
  summary:hover{color:var(--txt)}
  .toggles{display:flex;gap:14px;align-items:center;margin-top:10px;font-size:13px;color:var(--dim)}
  .toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}
  pre{margin:0;padding:14px;white-space:pre-wrap;word-break:break-word;
      font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:#dfe3ee;
      background:#161922;flex:1;max-height:70vh;overflow:auto}
  .empty{padding:14px;color:var(--dim);font-style:italic}
  .links{padding:8px 14px;border-top:1px solid var(--line);font-size:12px}
  .links a{color:#8ab4ff}
  .legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .legend span{font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;
               color:#0d0f14;text-transform:uppercase}
  @media (max-width:760px){
    body{font-size:14px}
    header{padding:10px 12px}
    h1{font-size:15px}
    .sub{font-size:11px}
    #menu{display:block}
    .panel{display:none}
    body.menu-open .panel{display:block}
    .pick{gap:8px}
    input[type=search],select{min-width:0;width:100%;font-size:16px}
    .hits{max-height:34vh;overflow:auto}
    .legend{display:none}
    body.menu-open .legend{display:flex}
    main{padding:12px 12px 48px}
    .teamhead h2{font-size:19px}
    .players{grid-template-columns:1fr;gap:12px}
    .card .top{flex-wrap:wrap;gap:8px}
    .disp{font-size:13px;padding:7px 11px}
    .short{font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;padding:12px}
    pre{max-height:50vh;font-size:12px}
  }
</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const teams = DATA.teams;
const q = document.getElementById('q'), sel = document.getElementById('sel'),
      hits = document.getElementById('hits'), out = document.getElementById('out'),
      cnt = document.getElementById('cnt');
let current = 0;

function fill(list){
  sel.innerHTML = '';
  list.forEach(t => {
    const o = document.createElement('option');
    o.value = teams.indexOf(t);
    o.textContent = t.name + '  (' + t.players.length + ')';
    sel.appendChild(o);
  });
  hits.innerHTML = '';
  list.slice(0, 24).forEach(t => {
    const b = document.createElement('button');
    b.textContent = t.name;
    b.dataset.i = teams.indexOf(t);
    if (teams.indexOf(t) === current) b.classList.add('on');
    b.onclick = () => show(+b.dataset.i);
    hits.appendChild(b);
  });
  cnt.textContent = list.length + ' / ' + teams.length + ' druzyn';
}

function filtered(){
  const s = q.value.trim().toLowerCase();
  if (!s) return teams;
  return teams.filter(t => t.name.toLowerCase().includes(s)
    || t.captain.toLowerCase().includes(s)
    || t.players.some(p => p.name.toLowerCase().includes(s)
                        || (p.faction || '').toLowerCase().includes(s)));
}

const menu = document.getElementById('menu');
const isMobile = () => window.matchMedia('(max-width:760px)').matches;
menu.onclick = () => {
  const open = document.body.classList.toggle('menu-open');
  menu.setAttribute('aria-expanded', open);
  menu.textContent = open ? 'Zamknij ✕' : 'Drużyny ▾';
};

const raw = document.getElementById('raw'), onlyraw = document.getElementById('onlyraw');

function shortHtml(s){
  const parts = s.split(/\n\s*\n/);
  const head = esc(parts[0] || '').split('\n').join('<br>');
  const body = esc(parts.slice(1).join('\n')).split('\n').join('<br>');
  return '<div class="hd">' + head + '</div>' + (body ? '<div>' + body + '</div>' : '');
}

function esc(s){ return (s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function show(i){
  current = i;
  const t = teams[i];
  if (!t) { out.innerHTML = ''; return; }
  sel.value = i;
  [...hits.children].forEach(b => b.classList.toggle('on', +b.dataset.i === i));
  const meta = [t.captain ? 'Kapitan: ' + t.captain : '',
                t.record && t.record.length ? t.record.join('-') : '',
                t.battlePoints != null ? t.battlePoints + ' BP' : '']
                .filter(Boolean).join(' · ');
  out.innerHTML = '<div class="teamhead"><h2>' + esc(t.name) + '</h2>'
    + '<div class="meta">' + esc(meta) + '</div></div>'
    + '<div class="players">' + t.players.map(p => {
        const k = p.dispKey || 'none';
        return '<section class="card b-' + k + '">'
          + '<div class="top"><div class="who"><div class="nm">' + esc(p.name) + '</div>'
          + '<div class="fc">' + esc(p.faction || '?') + '</div></div>'
          + '<div class="disp d-' + k + '">' + esc(p.disposition || 'brak') + '</div></div>'
          + (p.short && !onlyraw.checked
              ? '<div class="short">' + shortHtml(p.short) + '</div>' : '')
          + (p.list
              ? (onlyraw.checked
                  ? '<pre>' + esc(p.list) + '</pre>'
                  : '<details' + (raw.checked ? ' open' : '') + '><summary>pelna rozpiska</summary>'
                    + '<pre>' + esc(p.list) + '</pre></details>')
              : '<div class="empty">Brak tresci listy w BCP'
                + (p.listStatus ? ' (status: ' + esc(p.listStatus) + ')' : '') + '</div>')
          + (p.listUrl ? '<div class="links"><a href="' + p.listUrl + '" target="_blank">lista w BCP</a></div>' : '')
          + '</section>';
      }).join('') + '</div>';
  if (isMobile() && document.body.classList.contains('menu-open')) {
    document.body.classList.remove('menu-open');
    menu.setAttribute('aria-expanded', 'false');
    menu.textContent = t.name.length > 18 ? t.name.slice(0, 17) + '… ▾' : t.name + ' ▾';
  } else if (isMobile()) {
    menu.textContent = t.name.length > 18 ? t.name.slice(0, 17) + '… ▾' : t.name + ' ▾';
  }
  window.scrollTo(0, 0);
}

raw.onchange = onlyraw.onchange = () => show(current);
q.oninput = () => { const f = filtered(); fill(f); if (f.length) show(teams.indexOf(f[0])); };
sel.onchange = () => show(+sel.value);
document.onkeydown = e => { if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); } };
fill(teams); show(0);
</script>
</body>
</html>
